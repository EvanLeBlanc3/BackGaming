<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BackGaming">

<link rel="manifest" href="manifest.json">

<title>BackGaming</title>
<style>
:root{
  --bg:#0d0221;--bg2:#1a0b3a;--panel:#241050;--panel2:#2e1563;--text:#f4ecff;--muted:#a99bd1;
  --accent:#ff2a6d;--accent2:#05d9e8;--accent3:#f9c80e;--good:#3cff8f;--bad:#ff3860;
  --border:3px;--radius:4px;--font:"Courier New",ui-monospace,monospace;--title-font:var(--font);
  --pattern:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px);
  --glow:0 0 12px var(--accent);--card-shadow:4px 4px 0 #000;
  --st:max(env(safe-area-inset-top),20px);--sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font-family:var(--font);color:var(--text);-webkit-user-select:none;user-select:none;transition:background .4s}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--pattern),linear-gradient(180deg,var(--bg),var(--bg2));transition:background .4s}
#app.rotfix{transform-origin:top left}
header{padding:calc(var(--st) + 28px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--title-font);font-size:24px;font-weight:900;letter-spacing:1px;color:var(--accent);text-shadow:2px 2px 0 var(--accent2),var(--glow)}
.logo small{display:block;font-size:10px;letter-spacing:3px;color:var(--muted);text-shadow:none;font-weight:700}
.xpbox{text-align:right;font-size:11px;color:var(--muted);min-width:110px}
.xpbar{height:8px;background:var(--panel);border:2px solid var(--accent2);margin-top:4px;border-radius:var(--radius);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent3),var(--accent));transition:width .6s}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 110px}
.tabs-top{display:flex;gap:6px;margin:6px 0 10px}
.tabs-top button{flex:1}
button,.btn{font-family:var(--font);font-weight:800;font-size:13px;color:var(--text);background:var(--panel);border:var(--border) solid var(--accent2);border-radius:var(--radius);padding:9px 8px;box-shadow:var(--card-shadow);cursor:pointer;transition:transform .08s}
button:active{transform:translate(2px,2px);box-shadow:none}
button.on{background:var(--accent);border-color:var(--accent3);color:#fff}
.primary{background:var(--accent);border-color:var(--accent3);color:#fff}
.row{display:flex;gap:8px;align-items:center}
input,select,textarea{font-family:var(--font);font-size:16px;color:var(--text);background:var(--bg2);border:2px solid var(--accent2);border-radius:var(--radius);padding:9px;width:100%;outline:none}
textarea{min-height:70px;resize:none}
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters select{font-size:14px;padding:7px}
.card{display:flex;gap:10px;background:var(--panel);border:var(--border) solid var(--accent2);border-radius:var(--radius);padding:10px;margin-bottom:10px;box-shadow:var(--card-shadow);animation:pop .3s}
.cover{width:62px;height:82px;flex:none;border:2px solid var(--accent3);border-radius:var(--radius);background:var(--panel2) center/cover;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;text-shadow:2px 2px 0 #000;image-rendering:pixelated}
.info{flex:1;min-width:0}
.info h3{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--title-font)}
.meta{font-size:11px;color:var(--muted);margin:3px 0}
.hype{display:flex;gap:3px;margin:4px 0}
.hype i{width:14px;height:8px;background:var(--bg2);border:1px solid var(--accent3)}
.hype i.f{background:var(--accent3)}
.stars{color:var(--accent3);font-size:13px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts button{padding:5px 8px;font-size:11px;box-shadow:2px 2px 0 #000}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;line-height:1.6}
.empty b{font-size:40px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg2);border-top:var(--border) solid var(--accent);padding:6px 6px calc(var(--sb) + 6px);z-index:20}
nav button{flex:1;background:none;border:none;box-shadow:none;font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
nav button span{font-size:22px}
nav button.on{color:var(--accent3);background:none}
.fab{position:fixed;right:18px;bottom:calc(var(--sb) + 84px);width:60px;height:60px;border-radius:var(--radius);font-size:30px;background:var(--accent);border-color:var(--accent3);z-index:21;box-shadow:var(--glow),4px 4px 0 #000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:50}
.modal.show{display:flex}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg2);border-top:var(--border) solid var(--accent);padding:18px 16px calc(var(--sb) + 18px);animation:up .25s;border-radius:var(--radius) var(--radius) 0 0}
.sheet h2{font-family:var(--title-font);color:var(--accent3);margin-bottom:12px;font-size:20px}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:700}
.hypepick{display:flex;gap:6px}
.hypepick button{flex:1;padding:10px 0}
.panel{background:var(--panel);border:var(--border) solid var(--accent2);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)}
.panel h3{font-family:var(--title-font);color:var(--accent3);margin-bottom:8px;font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg2);padding:10px;border-radius:var(--radius);text-align:center;border:2px solid var(--panel2)}
.stat b{display:block;font-size:22px;color:var(--accent)}
.stat small{font-size:10px;color:var(--muted)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{position:relative;padding:10px 8px;border:3px solid transparent;border-radius:8px;text-align:left;box-shadow:none;overflow:hidden;min-height:74px}
.th.sel{border-color:#fff;box-shadow:0 0 0 2px #000,0 0 14px #fff}
.th .nm{font-size:13px;font-weight:900;display:block}
.th .ds{font-size:9px;opacity:.85;display:block;margin-top:2px;font-weight:600}
.th .sw{display:flex;gap:3px;margin-top:6px}
.th .sw i{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.4)}
.th .em{position:absolute;right:6px;top:6px;font-size:20px}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-family:var(--title-font);font-size:30px;font-weight:900;color:var(--accent3);text-shadow:3px 3px 0 var(--accent),0 0 20px var(--accent);z-index:90;pointer-events:none;text-align:center;white-space:nowrap}
#toast.go{animation:toast 1.5s forwards}
.fx{position:fixed;pointer-events:none;z-index:89;font-size:24px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:88}
#flash.go{animation:flash .4s}
.glitch{animation:glitch .5s forwards!important}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1s infinite;margin-left:4px}
#roller{font-family:var(--title-font);font-size:22px;text-align:center;padding:24px 10px;border:3px dashed var(--accent3);margin:10px 0;min-height:80px;color:var(--accent)}
.ratepick{display:flex;justify-content:center;gap:6px;font-size:38px;margin:14px 0}
.ratepick span{cursor:pointer;filter:grayscale(1);opacity:.5}
.ratepick span.on{filter:none;opacity:1}
.amb{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.amb i{position:absolute;font-style:normal;opacity:.35;animation:drift linear infinite}
header,main,nav{position:relative;z-index:2}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(0)}20%{transform:translate(-50%,-50%) scale(1.25)}35%,80%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@keyframes glitch{0%{transform:none}20%{transform:translate(-6px,2px) skewX(10deg);filter:hue-rotate(90deg)}40%{transform:translate(6px,-2px) skewX(-10deg)}60%{opacity:.6;clip-path:inset(20% 0 40% 0)}100%{opacity:0;transform:scaleY(0)}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{to{transform:translateY(-160px) rotate(var(--r));opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
@keyframes drift{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

/* ===== Theme-specific flourishes ===== */
body[data-theme=cozy] .card,body[data-theme=cozy] .panel{border-style:dashed}
body[data-theme=dungeon] .logo,body[data-theme=fantasy] .logo{letter-spacing:2px}
body[data-theme=scary] .logo{animation:flick 3s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.3}95%{opacity:1}97%{opacity:.5}}
body[data-theme=arcade] .logo{animation:neon 1.6s ease-in-out infinite alternate}
@keyframes neon{to{text-shadow:2px 2px 0 var(--accent2),0 0 24px var(--accent),0 0 40px var(--accent)}}
body[data-theme=gameboy] .cover{filter:grayscale(1) sepia(1) hue-rotate(50deg) saturate(2)}
body[data-theme=gameboy] *{text-shadow:none!important}
body[data-theme=vaporwave] .logo{font-style:italic}
body[data-theme=cyberpunk] .card{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
body[data-theme=western] .card,body[data-theme=western] .panel{border-style:double;border-width:5px}
body[data-theme=candy] .card,body[data-theme=candy] .panel{border-radius:18px}
</style>
</head>

let S=load();
let view="queue",listTab={queue:"",playing:"",cleared:""},sortBy="added",platF="all",draft=null;
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.games)return Object.assign({theme:"pixel",sound:true,ambient:true},d)}catch(e){}return{games:[],xp:0,lastBackup:0,theme:"pixel",sound:true,ambient:true}}
function save(){localStorage.setItem(K,JSON.stringify(S))}
const T=()=>THEMES[S.theme]||THEMES.pixel;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= THEME APPLY ================= */
function applyTheme(id,anim){
  const t=THEMES[id]||THEMES.pixel,c=t.c,r=document.documentElement.style;
  ["--bg","--bg2","--panel","--panel2","--text","--muted","--accent","--accent2","--accent3"].forEach((v,i)=>r.setProperty(v,c[i]));
  r.setProperty("--font",t.font);r.setProperty("--title-font",t.font);r.setProperty("--radius",t.r+"px");
  r.setProperty("--glow",id==="candy"?"0 4px 12px rgba(255,79,163,.4)":"0 0 12px "+c[6]);
  r.setProperty("--card-shadow",id==="candy"?"0 4px 0 #e0a3c3":"4px 4px 0 #000");
  const pats={pixel:"repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px)",
   arcade:"repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.04) 2px 3px)",
   dungeon:"repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.35) 38px 40px),repeating-linear-gradient(90deg,transparent 0 78px,rgba(0,0,0,.3) 78px 80px)",
   cozy:"radial-gradient(circle at 20% 10%,rgba(242,204,143,.12),transparent 40%)",
   scary:"radial-gradient(ellipse at 50% 0%,rgba(179,0,0,.25),transparent 60%)",
   fantasy:"radial-gradient(circle at 80% 15%,rgba(255,209,102,.18),transparent 30%)",
   adventure:"radial-gradient(circle at 10% 90%,rgba(42,157,143,.2),transparent 45%)",
   scifi:"linear-gradient(rgba(56,189,248,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.05) 1px,transparent 1px)",
   cyberpunk:"repeating-linear-gradient(115deg,transparent 0 30px,rgba(0,240,255,.04) 30px 31px)",
   gameboy:"repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.15) 2px 3px),repeating-linear-gradient(90deg,transparent 0 2px,rgba(0,0,0,.15) 2px 3px)",
   vaporwave:"linear-gradient(transparent 60%,rgba(255,113,206,.15)),repeating-linear-gradient(90deg,transparent 0 40px,rgba(1,205,254,.08) 40px 41px)",
   candy:"radial-gradient(circle,rgba(255,79,163,.12) 3px,transparent 4px)",
   ocean:"radial-gradient(ellipse at 50% -10%,rgba(46,196,182,.25),transparent 60%)",
   samurai:"radial-gradient(circle at 85% 12%,rgba(214,40,40,.35) 0 50px,transparent 51px)",
   western:"radial-gradient(circle at 50% 110%,rgba(244,211,94,.25),transparent 60%)",
   space:"radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 20%,#fff,transparent)"};
  r.setProperty("--pattern",pats[id]||pats.pixel);
  if(id==="scifi")document.getElementById("app").style.backgroundSize="24px 24px,24px 24px,auto";else if(id==="candy")document.getElementById("app").style.backgroundSize="28px 28px,auto";else document.getElementById("app").style.backgroundSize="";
  document.body.dataset.theme=id;
  document.getElementById("themeColorMeta").content=c[0];
  document.getElementById("tagline").textContent=t.tag;
  document.getElementById("logo").firstChild.textContent=t.em+" BACKGAMING";
  buildAmbient();
  if(anim){flash();toast(t.name.toUpperCase()+"!");burst(t.fx,16)}
}
function buildAmbient(){
  const a=document.getElementById("amb");a.innerHTML="";const t=T();
  if(!S.ambient||!t.amb.length)return;
  for(let i=0;i<10;i++){const e=document.createElement("i");e.textContent=t.amb[i%t.amb.length];
   e.style.left=Math.random()*100+"%";e.style.fontSize=(12+Math.random()*16)+"px";
   e.style.animationDuration=(14+Math.random()*16)+"s";e.style.animationDelay=(-Math.random()*25)+"s";a.appendChild(e)}
}

/* ================= SOUND ================= */
let AC;
function tone(seq){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const w=T().wave;let t=AC.currentTime;
 seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.85})}catch(e){}}
const SND={
 save:()=>tone([[988,.08],[1319,.25]]),
 start:()=>tone([[392,.08],[523,.08],[659,.08],[784,.2]]),
 clear:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3],[784,.1],[1047,.4]]),
 del:()=>tone([[400,.15],[300,.15],[200,.15],[100,.4]]),
 click:()=>tone([[660,.04]]),
 roll:()=>tone([[300+Math.random()*600,.04]])
};

/* ================= FX ================= */
function toast(txt){const t=document.getElementById("toast");t.textContent=txt;t.classList.remove("go");void t.offsetWidth;t.classList.add("go")}
function flash(){const f=document.getElementById("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}
function burst(icons,n,mode){for(let i=0;i<n;i++){const e=document.createElement("div");e.className="fx";e.textContent=icons[i%icons.length];
 const W=innerWidth;e.style.setProperty("--r",(Math.random()*720-360)+"deg");
 if(mode==="fall"){e.style.left=Math.random()*W+"px";e.style.top="-30px";e.style.animation=`fall ${1.6+Math.random()*1.4}s linear forwards`}
 else{e.style.left=(W/2-60+Math.random()*120)+"px";e.style.top=(innerHeight*.5+Math.random()*40)+"px";e.style.animation=`rise ${.8+Math.random()*.6}s ease-out forwards`}
 document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}}

/* ================= XP ================= */
const LV=[0,50,150,300,500,800,1200];
function lvl(){let l=0;LV.forEach((x,i)=>{if(S.xp>=x)l=i});return l}
function addXP(n){const b=lvl();S.xp+=n;save();renderXP();if(lvl()>b){setTimeout(()=>{toast("LEVEL UP!");SND.clear()},1600)}}
function renderXP(){const l=lvl(),nx=LV[l+1]||LV[l]+500,pv=LV[l];
 document.getElementById("rank").textContent=`LV ${l+1} · ${T().ranks[l]}`;
 document.getElementById("xpfill").style.width=Math.min(100,(S.xp-pv)/(nx-pv)*100)+"%";
 document.getElementById("xptxt").textContent=S.xp+" XP"}

/* ================= COVER ================= */
function initials(t){return(t||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function hueOf(s){let h=0;for(const c of s||"")h=(h*31+c.charCodeAt(0))%360;return h}
function coverHTML(g){if(g.art)return`<div class="cover" style="background-image:url(${g.art})"></div>`;
 const h=hueOf(g.title);return`<div class="cover" style="background:repeating-linear-gradient(45deg,hsl(${h},70%,35%) 0 8px,hsl(${h},70%,28%) 8px 16px)">${esc(initials(g.title))}</div>`}

/* ================= RENDER ================= */
const HYPE=["Meh, maybe","Kinda curious","Sounds fun","Really want it","MUST PLAY"];
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 document.getElementById("fab").style.display=["queue","playing"].includes(view)?"":"none";
 const m=document.getElementById("main");
 if(view==="roll")return renderRoll(m);
 if(view==="player")return renderPlayer(m);
 const st=view;let list=S.games.filter(g=>g.status===st);
 const plats=[...new Set(S.games.map(g=>g.platform).filter(Boolean))].sort();
 const q=(listTab[st]||"").toLowerCase();
 if(q)list=list.filter(g=>(g.title+" "+g.genre+" "+g.notes).toLowerCase().includes(q));
 if(platF!=="all")list=list.filter(g=>g.platform===platF);
 list.sort((a,b)=>sortBy==="title"?a.title.localeCompare(b.title):sortBy==="hype"?b.hype-a.hype:sortBy==="rating"?(b.rating||0)-(a.rating||0):b.added-a.added);
 const label={queue:"🕹️ QUEUE",playing:"🎮 NOW PLAYING",cleared:"🏆 HALL OF FAME"}[st];
 m.innerHTML=`<h2 style="font-family:var(--title-font);color:var(--accent3);margin:4px 0 8px;font-size:18px">${label} <span style="color:var(--muted);font-size:13px">(${S.games.filter(g=>g.status===st).length})</span></h2>
 <input id="q" placeholder="🔍 Search..." value="${esc(listTab[st])}" style="margin-bottom:8px">
 <div class="filters"><select id="sort"><option value="added">Newest</option><option value="title">A–Z</option><option value="hype">Hype</option>${st==="cleared"?'<option value="rating">Rating</option>':""}</select>
 <select id="plat"><option value="all">All platforms</option>${plats.map(p=>`<option ${p===platF?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
 <div id="list">${list.length?list.map(card).join(""):`<div class="empty"><b>${T().em}</b>${st==="queue"?"Your backlog is empty!<br>Tap + to add a game.":st==="playing"?"Nothing in progress.<br>Start something from your Queue!":"No games cleared yet.<br>Go get that W!"}</div>`}</div>`;
 const qi=document.getElementById("q");qi.oninput=e=>{listTab[st]=e.target.value;const p=qi.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
 const so=document.getElementById("sort");so.value=sortBy;so.onchange=e=>{sortBy=e.target.value;render()};
 document.getElementById("plat").onchange=e=>{platF=e.target.value;render()};
}
function card(g){const hy=[1,2,3,4,5].map(i=>`<i class="${i<=g.hype?"f":""}"></i>`).join("");
 let acts="";
 if(g.status==="queue")acts=`<button onclick="startG('${g.id}')">▶ START</button>`;
 if(g.status==="playing")acts=`<button onclick="clearG('${g.id}')">🏆 CLEAR</button><button onclick="moveG('${g.id}','queue')">⏸ SHELVE</button>`;
 if(g.status==="cleared")acts=`<button onclick="rateG('${g.id}')">⭐ RATE</button><button onclick="moveG('${g.id}','playing')">🔁 REPLAY</button>`;
 acts+=`<button onclick="openAdd('${g.id}')">✏️</button><button onclick="delG('${g.id}')">🗑</button>`;
 return`<div class="card" id="c_${g.id}">${coverHTML(g)}<div class="info"><h3>${esc(g.title)}</h3>
 <div class="meta">${esc(g.platform||"Any platform")}${g.genre?" · "+esc(g.genre):""}</div>
 <div class="hype">${hy}</div><div class="meta">${HYPE[g.hype-1]}</div>
 ${g.status==="cleared"&&g.rating?`<div class="stars">${"★".repeat(g.rating)}${"☆".repeat(5-g.rating)}</div>`:""}
 ${g.notes?`<div class="meta" style="white-space:normal">📝 ${esc(g.notes)}</div>`:""}
 <div class="acts">${acts}</div></div></div>`}

function renderRoll(m){const q=S.games.filter(g=>g.status==="queue");
 m.innerHTML=`<div class="panel"><h3>🎲 ROLL FOR YOUR NEXT GAME</h3><p class="meta">Higher hype = better odds. ${q.length} games in the pool.</p>
 <div id="roller">${q.length?"???":"Add games to your Queue first!"}</div>
 <button class="primary" style="width:100%" ${q.length?"":"disabled"} onclick="roll()">🎰 ROLL!</button><div id="rollAct" style="margin-top:8px"></div></div>`}
function roll(){const q=S.games.filter(g=>g.status==="queue");if(!q.length)return;
 const pool=[];q.forEach(g=>{for(let i=0;i<g.hype*g.hype;i++)pool.push(g)});
 const pick=pool[Math.floor(Math.random()*pool.length)],r=document.getElementById("roller");let n=0,steps=18;
 document.getElementById("rollAct").innerHTML="";
 (function spin(){r.textContent=q[Math.floor(Math.random()*q.length)].title;SND.roll();n++;
  if(n<steps)setTimeout(spin,40+n*n*1.2);else{r.textContent="▶ "+pick.title+" ◀";r.style.animation="bounce .5s 2";setTimeout(()=>r.style.animation="",1000);SND.save();burst(T().fx,10);
   document.getElementById("rollAct").innerHTML=`<button style="width:100%" onclick="startG('${pick.id}');view='playing';render()">▶ START IT NOW</button>`}})()}

function renderPlayer(m){
 const g=S.games,cl=g.filter(x=>x.status==="cleared"),rated=cl.filter(x=>x.rating);
 const avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):"—";
 const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null,stale=days===null||days>7;
 const plats={};g.forEach(x=>{if(x.platform)plats[x.platform]=(plats[x.platform]||0)+1});
 const top=Object.entries(plats).sort((a,b)=>b[1]-a[1])[0];
 m.innerHTML=`
 <div class="panel"><h3>🎨 THEME</h3><p class="meta" style="margin-bottom:8px">Changes colors, fonts, sounds, rank titles & victory messages.</p>
 <div class="themes">${Object.entries(THEMES).map(([id,t])=>`<button class="th ${S.theme===id?"sel":""}" style="background:linear-gradient(135deg,${t.c[2]},${t.c[0]});color:${t.c[4]};font-family:${t.font.replace(/"/g,"'")};border-radius:${Math.min(t.r,12)}px" onclick="setTheme('${id}')">
  <span class="em">${t.em}</span><span class="nm">${t.name}</span><span class="ds">${t.ds}</span>
  <span class="sw"><i style="background:${t.c[6]}"></i><i style="background:${t.c[7]}"></i><i style="background:${t.c[8]}"></i></span></button>`).join("")}
  <button class="th" style="background:repeating-linear-gradient(45deg,#ff2a6d 0 12px,#05d9e8 12px 24px,#f9c80e 24px 36px);color:#fff;text-shadow:1px 1px 0 #000" onclick="randomTheme()"><span class="em">🔀</span><span class="nm">Surprise Me</span><span class="ds">Random theme roulette</span></button></div>
 <div class="row" style="margin-top:10px"><button style="flex:1" onclick="S.sound=!S.sound;save();render()">${S.sound?"🔊 Sound ON":"🔇 Sound OFF"}</button>
 <button style="flex:1" onclick="S.ambient=!S.ambient;save();buildAmbient();render()">${S.ambient?"✨ Ambient ON":"✨ Ambient OFF"}</button></div></div>
 <div class="panel"><h3>📊 STATS</h3><div class="stats">
 <div class="stat"><b>${g.filter(x=>x.status==="queue").length}</b><small>IN QUEUE</small></div>
 <div class="stat"><b>${g.filter(x=>x.status==="playing").length}</b><small>PLAYING</small></div>
 <div class="stat"><b>${cl.length}</b><small>CLEARED</small></div>
 <div class="stat"><b>${avg}</b><small>AVG RATING</small></div>
 <div class="stat"><b>${S.xp}</b><small>TOTAL XP</small></div>
 <div class="stat"><b style="font-size:15px">${top?esc(top[0]):"—"}</b><small>TOP PLATFORM</small></div></div></div>
 <div class="panel"><h3>💾 BACKUP ${stale?'<span class="dot"></span>':""}</h3>
 <p class="meta" style="margin-bottom:10px">${days===null?"Never backed up!":days===0?"Backed up today ✅":`Last backup ${days} day${days>1?"s":""} ago`}</p>
 <button class="primary" style="width:100%;margin-bottom:8px" onclick="exportData()">⬇ EXPORT SAVE FILE</button>
 <button style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">⬆ LOAD SAVE FILE</button>
 <div class="row"><button style="flex:1" onclick="copyCode()">📋 COPY CODE</button><button style="flex:1" onclick="pasteCode()">📥 PASTE CODE</button></div></div>`}

/* ================= ACTIONS ================= */
function setTheme(id){if(S.theme===id)return;S.theme=id;save();applyTheme(id,true);renderXP();render()}
function randomTheme(){const ids=Object.keys(THEMES).filter(i=>i!==S.theme);setTheme(ids[Math.floor(Math.random()*ids.length)])}
function find(id){return S.games.find(g=>g.id===id)}
function startG(id){const g=find(id);g.status="playing";g.started=Date.now();save();flash();toast(T().w.start);SND.start();addXP(10);render()}
function moveG(id,st){find(id).status=st;save();SND.click();render()}
function clearG(id){const g=find(id);g.status="cleared";g.cleared=Date.now();save();toast(T().w.clear);SND.clear();burst(["🎉","🎊",...T().fx],40,"fall");
 const tr=document.createElement("div");tr.className="fx";tr.textContent="🏆";tr.style.cssText="left:50%;top:55%;font-size:70px;transform:translateX(-50%);animation:bounce .5s 3";document.body.appendChild(tr);setTimeout(()=>tr.remove(),1600);
 addXP(50);render();setTimeout(()=>rateG(id),1500)}
function delG(id){if(!confirm("Delete this game?"))return;const c=document.getElementById("c_"+id);if(c)c.classList.add("glitch");SND.del();toast(T().w.del);
 setTimeout(()=>{S.games=S.games.filter(g=>g.id!==id);save();render()},500)}
function rateG(id){const g=find(id);let r=g.rating||0;
 openSheet(`<h2>⭐ RATE ${esc(g.title)}</h2><div class="ratepick" id="rp">${[1,2,3,4,5].map(i=>`<span data-i="${i}">⭐</span>`).join("")}</div>
 <div class="row"><button style="flex:1" onclick="closeSheet()">SKIP</button><button class="primary" style="flex:1" id="rsave">SAVE</button></div>`);
 const upd=()=>document.querySelectorAll("#rp span").forEach(s=>s.classList.toggle("on",+s.dataset.i<=r));upd();
 document.querySelectorAll("#rp span").forEach(s=>s.onclick=()=>{r=+s.dataset.i;SND.click();upd()});
 document.getElementById("rsave").onclick=()=>{g.rating=r;save();closeSheet();SND.save();render()}}

function openAdd(id){const g=id?find(id):null;draft={art:g?g.art:"",hype:g?g.hype:3};
 openSheet(`<h2>${g?"✏️ EDIT GAME":"➕ NEW GAME"}</h2>
 <label>TITLE</label><input id="fT" value="${esc(g?g.title:"")}" placeholder="e.g. Hollow Knight">
 <label>PLATFORM</label><input id="fP" list="pl" value="${esc(g?g.platform:"")}" placeholder="Switch, PS5, PC..."><datalist id="pl">${["PC","PS5","PS4","Xbox Series X|S","Switch","Switch 2","Steam Deck","iPhone","Retro"].map(p=>`<option>${p}</option>`).join("")}</datalist>
 <label>GENRE</label><input id="fG" value="${esc(g?g.genre:"")}" placeholder="RPG, Platformer...">
 <label>HYPE METER</label><div class="hypepick" id="hp">${[1,2,3,4,5].map(i=>`<button data-i="${i}">${"🔥".repeat(1)}${i}</button>`).join("")}</div><div class="meta" id="hl" style="margin-top:4px"></div>
 <label>BOX ART</label><div class="row"><div id="artPrev">${coverHTML({title:g?g.title:"?",art:draft.art})}</div><button onclick="document.getElementById('artFile').click()">📷 ADD ART</button>${draft.art?'<button onclick="draft.art=\'\';document.getElementById(\'artPrev\').innerHTML=coverHTML({title:\'?\'})">✖</button>':""}</div>
 <label>NOTES</label><textarea id="fN" placeholder="Why you want to play it...">${esc(g?g.notes:"")}</textarea>
 <div class="row" style="margin-top:14px"><button style="flex:1" onclick="closeSheet()">CANCEL</button><button class="primary" style="flex:2" onclick="saveG('${id||""}')">💾 SAVE</button></div>`);
 const upd=()=>{document.querySelectorAll("#hp button").forEach(b=>b.classList.toggle("on",+b.dataset.i<=draft.hype));document.getElementById("hl").textContent=HYPE[draft.hype-1]};upd();
 document.querySelectorAll("#hp button").forEach(b=>b.onclick=()=>{draft.hype=+b.dataset.i;SND.click();upd()})}
function saveG(id){const t=document.getElementById("fT").value.trim();if(!t){document.getElementById("fT").focus();return}
 const d={title:t,platform:document.getElementById("fP").value.trim(),genre:document.getElementById("fG").value.trim(),notes:document.getElementById("fN").value.trim(),hype:draft.hype,art:draft.art};
 if(id)Object.assign(find(id),d);else{S.games.push(Object.assign({id:uid(),status:view==="playing"?"playing":"queue",added:Date.now()},d));addXP(5)}
 save();closeSheet();toast(T().w.save);SND.save();burst(T().fx,14);render()}

document.getElementById("artFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),W=180,H=240;c.width=W;c.height=H;const x=c.getContext("2d"),s=Math.max(W/im.width,H/im.height);x.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s);draft.art=c.toDataURL("image/jpeg",.75);document.getElementById("artPrev").innerHTML=coverHTML({art:draft.art})};im.src=rd.result};rd.readAsDataURL(f);e.target.value=""};

function openSheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("show")}
function closeSheet(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeSheet()};

/* ================= BACKUP ================= */
function payload(){return JSON.stringify({app:"BackGaming",v:2,exported:Date.now(),data:S})}
function markBackup(){S.lastBackup=Date.now();save();render()}
async function exportData(){const name=`BackGaming-${new Date().toISOString().slice(0,10)}.json`,blob=new Blob([payload()],{type:"application/json"});
 try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"BackGaming Save"});markBackup();toast("BACKED UP!");SND.save();return}}catch(e){if(e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();markBackup();toast("BACKED UP!");SND.save()}
function restore(txt){try{const o=JSON.parse(txt),d=o.data||o;if(!d.games)throw 0;
 const merge=confirm(`Found ${d.games.length} games.\n\nOK = MERGE with current\nCancel = REPLACE everything`);
 if(merge){const ids=new Set(S.games.map(g=>g.id));d.games.forEach(g=>{if(!ids.has(g.id))S.games.push(g)});S.xp=Math.max(S.xp,d.xp||0)}
 else{S=Object.assign({theme:S.theme,sound:true,ambient:true},d)}
 save();applyTheme(S.theme);renderXP();render();toast("SAVE LOADED!");SND.clear()}catch(e){alert("That doesn't look like a BackGaming save.")}}
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(restore);e.target.value=""};
function copyCode(){const c=btoa(unescape(encodeURIComponent(payload())));navigator.clipboard.writeText(c).then(()=>{markBackup();toast("CODE COPIED!");SND.save()},()=>prompt("Copy this code:",c))}
function pasteCode(){const c=prompt("Paste your backup code:");if(!c)return;try{restore(decodeURIComponent(escape(atob(c.trim()))))}catch(e){alert("Invalid code.")}}

/* ================= NAV + ROTATION LOCK ================= */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;platF="all";SND.click();render();document.getElementById("main").scrollTop=0});
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("portrait").catch(()=>{})}catch(e){}
function fixRot(){const a=document.getElementById("app"),land=innerWidth>innerHeight&&Math.min(innerWidth,innerHeight)<600;
 if(land){const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||90;const cw=ang===90||ang===-270;
  a.classList.add("rotfix");a.style.width=innerHeight+"px";a.style.height=innerWidth+"px";
  a.style.transform=cw?`rotate(-90deg) translateX(-${innerHeight}px)`:`rotate(90deg) translateY(-${innerWidth}px)`}
 else{a.classList.remove("rotfix");a.style.width=a.style.height=a.style.transform=""}}
addEventListener("resize",fixRot);addEventListener("orientationchange",()=>setTimeout(fixRot,100));

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
applyTheme(S.theme);renderXP();render();fixRot();
</script>
</body>
